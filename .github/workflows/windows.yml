name: Build Windows app

on:
  push:
    branches: [main]
    paths:
      - "windows-app/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build portable Windows app
        run: .\gradlew.bat createDistributable --no-daemon

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: agnes-ai-image-studio-windows
          path: windows-app/build/compose/binaries/main/app/**
          if-no-files-found: error
