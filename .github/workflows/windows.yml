name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "Windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Windows/AgnesEditImage
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore AgnesEditImage.csproj

      - name: Publish
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BASE_URL: ${{ secrets.AGNES_BASE_URL }}
        run: dotnet publish AgnesEditImage.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agnes-edit-image-windows
          path: Windows/AgnesEditImage/publish/AgnesEditImage.exe
          if-no-files-found: error
