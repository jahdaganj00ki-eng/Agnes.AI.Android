name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: bash gradlew :app:assembleDebug --no-daemon
        env:
          # Optional: bake the key into BuildConfig. If unset, the app still
          # builds and the key can be entered in the in-app settings.
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agnes-edit-image-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
